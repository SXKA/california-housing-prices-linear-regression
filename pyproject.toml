[project]
name = "california-housing-prices-linear-regression"
version = "0.1.0"
description = "Linear regression with gradient descent from scratch on the California housing dataset."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib",
    "seaborn",
    "pandas>=2.1",
    "scipy",
    "numpy",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "scikit-learn",
]

[tool.uv]
# Scripts, not an installable package.
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
